name: Java CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [h2, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: campusflow_test
          MYSQL_USER: campusflow
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: H2 integration and concurrency tests
        if: matrix.database == 'h2'
        run: mvn -B -DargLine=-Duser.timezone=UTC verify
      - name: MySQL integration and concurrency tests
        if: matrix.database == 'mysql'
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/campusflow_test?serverTimezone=Asia/Shanghai
          TEST_DB_USERNAME: campusflow
          TEST_DB_PASSWORD: ci-test-password
        run: mvn -B -DargLine=-Duser.timezone=UTC verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.database }}
          path: target/surefire-reports

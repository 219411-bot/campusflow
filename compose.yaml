services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campusflow
      MYSQL_USER: campusflow
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u campusflow -D campusflow -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/campusflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: campusflow
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_DEMO: ${SEED_DEMO:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:

spring:
  application:
    name: campusflow
  profiles:
    default: demo
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 10000
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring.web.resources.cache.cachecontrol.max-age: 1h
app:
  require-verification: true
  rate-limit-multiplier: 1
---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:file:./data/campusflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
app:
  seed-demo: true
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campusflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:campusflow}
    password: ${DB_PASSWORD}
app:
  seed-demo: ${SEED_DEMO:false}
server.servlet.session.cookie.secure: ${COOKIE_SECURE:true}
